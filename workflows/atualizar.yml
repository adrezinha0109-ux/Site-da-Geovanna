# Atualiza os dados e republica o site sozinho.
# - Roda a cada 30 minutos, quando você muda algo no repositório e quando você clica em "Run workflow".
# - Não precisa de senha nem de configuração extra (só ativar o Pages em "GitHub Actions" — veja o README).
name: Atualizar e publicar

on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Buscar dados atualizados (Ceará, shows, discografias, feats)
        run: node scripts/atualizar.mjs

      # O GitHub desliga agendamentos de repositórios parados por 60 dias.
      # Se o último commit tiver mais de 45 dias, fazemos um commit vazio só pra "acordar" o repositório.
      - name: Manter o agendamento ativo
        run: |
          ultimo=$(git log -1 --format=%ct)
          agora=$(date +%s)
          if [ $(( (agora - ultimo) / 86400 )) -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: mantém o agendamento ativo"
            git push || true
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
